services:
  aimtp-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Canonical host. Baked into the bundle at build time, so changing it
        # requires a rebuild, not just a restart.
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-https://aimtp.net}"
    # Loopback only: TLS and the public hostname are the reverse proxy's job,
    # matching how the sibling 2600i sites are served.
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-https://aimtp.net}"
      # Backs /demo/agent-trust-gateway. Server-side only, read at run time, so
      # it can be set without a rebuild. Empty means the page renders its
      # "unavailable" state and points at the recorded run — which is the
      # correct behaviour until the sidecar is actually deployed.
      AIMTP_DEMO_ORIGIN: "${AIMTP_DEMO_ORIGIN:-}"
    restart: unless-stopped
    # Joined only when the demo sidecar is running. `aimtp-demo` is created once
    # with `docker network create aimtp-demo` and shared with the protocol
    # repository's docker-compose.demo.yml.
    networks:
      - default
      - aimtp-demo

networks:
  aimtp-demo:
    external: true
    name: aimtp-demo
